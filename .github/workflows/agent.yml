name: Collect AI content
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          MAX_ITEMS_PER_SOURCE: 8
          MAX_GENERATIONS_PER_RUN: 6
          GENERATION_DELAY: 4
        run: python -m agent.main
      - name: Commit collected content
        run: |
          git config user.name "ai-portal-bot"
          git config user.email "ai-portal-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "chore: collect AI sources"
          fi
          git pull --rebase origin main
          git push
      - name: Trigger site deploy
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
